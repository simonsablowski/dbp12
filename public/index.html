<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.title">Dora-Benjamin-Park 12 · Möblierte Wohnung in Berlin-Stralau</title>
  <meta name="description" data-i18n-attr="content:meta.description" content="">
  <link rel="canonical" href="https://dbp12.simsab.net/">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <a class="brand" href="#top">DBP<span>12</span></a>
      <nav class="mainnav" aria-label="Navigation">
        <a href="#flat" data-i18n="nav.flat">Wohnung</a>
        <a href="#terms" data-i18n="nav.terms">Konditionen</a>
        <a href="#area" data-i18n="nav.area">Stralau</a>
        <a href="#contact" class="nav-cta" data-i18n="nav.contact">Kontakt</a>
      </nav>
      <div class="lang" role="group" data-i18n-attr="aria-label:lang.switch">
        <button type="button" data-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-media"><img id="hero-img" src="" alt=""></div>
      <div class="wrap hero-text">
        <div class="hero-panel">
          <p class="kicker" data-i18n="hero.kicker"></p>
          <h1 data-i18n="hero.title"></h1>
          <p class="lead" data-i18n="hero.lead"></p>
          <p><a class="btn" href="#contact" data-i18n="hero.cta"></a></p>
        </div>
      </div>
    </section>

    <section id="flat" class="section">
      <div class="wrap">
        <div class="two-col">
          <div class="prose">
            <h2 data-i18n="flat.title"></h2>
            <p data-i18n="flat.p1"></p>
            <p data-i18n="flat.p2"></p>
            <p data-i18n="flat.p3"></p>
          </div>
          <aside class="facts">
            <h3 data-i18n="flat.factsTitle"></h3>
            <ul>
              <li data-i18n="flat.fact.view"></li>
              <li data-i18n="flat.fact.size"></li>
              <li data-i18n="flat.fact.persons"></li>
              <li data-i18n="flat.fact.bed"></li>
              <li data-i18n="flat.fact.work"></li>
              <li data-i18n="flat.fact.washer"></li>
              <li data-i18n="flat.fact.kitchen"></li>
              <li data-i18n="flat.fact.bath"></li>
              <li data-i18n="flat.fact.heating"></li>
              <li data-i18n="flat.fact.wifi"></li>
              <li data-i18n="flat.fact.nosmoking"></li>
            </ul>
          </aside>
        </div>

        <h3 class="sub" data-i18n="flat.galleryTitle"></h3>
        <div class="gallery" id="gallery"></div>
      </div>
    </section>

    <section id="terms" class="section section-tint">
      <div class="wrap two-col">
        <div class="prose">
          <h2 data-i18n="terms.title"></h2>
          <p data-i18n="terms.p1"></p>
          <p data-i18n="terms.p2"></p>
        </div>
        <aside class="facts">
          <h3 data-i18n="terms.factsTitle"></h3>
          <ul>
            <li data-i18n="terms.fact.available"></li>
            <li data-i18n="terms.fact.duration"></li>
            <li data-i18n="terms.fact.furnished"></li>
            <li data-i18n="terms.fact.registration"></li>
            <li data-i18n="terms.fact.rent"></li>
          </ul>
        </aside>
      </div>
    </section>

    <section id="area" class="section">
      <div class="wrap two-col">
        <div class="prose">
          <h2 data-i18n="area.title"></h2>
          <p data-i18n="area.p1"></p>
          <p data-i18n="area.p2"></p>
          <p data-i18n="area.p3"></p>
        </div>
        <aside class="facts">
          <h3 data-i18n="area.tipsTitle"></h3>
          <ul>
            <li data-i18n="area.tip1"></li>
            <li data-i18n="area.tip2"></li>
            <li data-i18n="area.tip3"></li>
            <li data-i18n="area.tip4"></li>
            <li data-i18n="area.tip5"></li>
            <li data-i18n="area.tip6"></li>
            <li data-i18n="area.tip7"></li>
          </ul>
        </aside>
      </div>
      <div class="wrap">
        <h3 class="sub" data-i18n="area.galleryTitle"></h3>
        <div class="gallery gallery-area" id="gallery-area"></div>
      </div>
    </section>

    <section id="contact" class="section section-tint">
      <div class="wrap prose">
        <h2 data-i18n="contact.title"></h2>
        <p data-i18n="contact.lead"></p>
        <p class="contact-lines">
          <span><span data-i18n="contact.mailLabel"></span> <a href="mailto:contact@simsab.net">contact@simsab.net</a></span>
          <span>WhatsApp: <strong>@simonsablowski</strong></span>
        </p>
        <p class="small" data-i18n="contact.how"></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <span>Dora-Benjamin-Park 12 · 10245 Berlin</span>
      <span class="footer-links">
        <a href="legal.html#imprint" data-i18n="footer.imprint"></a>
        <a href="legal.html#privacy" data-i18n="footer.privacy"></a>
      </span>
    </div>
  </footer>

  <dialog id="lightbox" class="lightbox">
    <button type="button" class="close" data-close data-i18n-attr="aria-label:lightbox.close">×</button>
    <button type="button" class="lb-nav lb-prev" id="lightbox-prev" data-i18n-attr="aria-label:gallery.prev">‹</button>
    <figure><img id="lightbox-img" src="" alt=""><figcaption><span id="lightbox-cap"></span> <span class="lb-count" id="lightbox-count"></span></figcaption></figure>
    <button type="button" class="lb-nav lb-next" id="lightbox-next" data-i18n-attr="aria-label:gallery.next">›</button>
  </dialog>

  <script src="js/app.js" type="module"></script>
</body>
</html>
